<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUGASKU</title>
    <link rel="stylesheet" href="css/menu/beranda.css" />
    <link rel="stylesheet" href="css/menu/mengajar.css" />
    <link rel="stylesheet" href="css/menu/terdaftar.css" />
    <link rel="stylesheet" href="css/menu/tim.css" />
    <link rel="stylesheet" href="css/menu/tugas.css" />
    <link rel="stylesheet" href="css/partials/cardKecilKosong.css" />
    <link rel="stylesheet" href="css/partials/cardPanjangKosong.css" />
    <link rel="stylesheet" href="css/partials/cardKecilIsi.css" />
    <link rel="stylesheet" href="css/partials/dropdown-menu.css" />
    <link rel="stylesheet" href="css/partials/header.css" />
    <link rel="stylesheet" href="css/partials/label-p.css" />
    <link rel="stylesheet" href="css/partials/navbar.css" />
    <link rel="stylesheet" href="css/partials/popup-alert.css" />
    <link rel="stylesheet" href="css/partials/buttonAddClass.css" />
    <link rel="stylesheet" href="css/partials/navInner.css" />
    <link rel="stylesheet" href="css/menu/innerClass.css">
    <link rel="stylesheet" href="css/menu/addClass.css">
    <link rel="stylesheet" href="css/partials/buttonChangeCover.css">
    <link rel="stylesheet" href="css/partials/scrollPage.css">
    <link rel="stylesheet" href="css/partials/settingUser.css">
    <link rel="stylesheet" href="css/partials/infoTask.css">
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="main-wrapper">

      <div class="fade-container"></div>
      <!-- Header -->
      <div class="header">
        <div class="navbar">
          <img id="menu-icon" src="img/icon-menu.png" alt="Menu Icon" />
          <span id="menu-label">Beranda</span>
        </div>
        <div class="profile-menu">
          <img
            id="profile-icon"
            src="img/icon-profile.jpg"
            alt="Profile Icon"
          />
        </div>
      </div>

      <!-- Panel Setting -->
      <nav class="panel-setting" id="panel-setting">
        <div class="setting-profile">
          <img id="profile-icon" src="img/icon-profile.jpg" alt="Profile Icon">
          <img id="icon-set-profile" src="img/icon-set-profile.png" alt="Set Profile">
          <div class="container-info-user">
            <p class="info-username" id="info-username">
              Username anda
            </p>
            <p class="info-email" id="info-email">
              Emailanda@gmail.com
            </p>
          </div>
        </div>
        <p class="label-p" style="margin-bottom: 3px;">
          <img src="img/icon-username.png" alt="Lastseen Icon" class="icon-label" />
          Username
        </p>
        <input type="text" class="txt-set-user" id="set-username" placeholder="Username anda">
        <p class="label-p" style="margin-bottom: 3px;">
          <img src="img/icon-email-abu.png" alt="Lastseen Icon" class="icon-label" />
          Email
        </p>
        <input type="text" class="txt-set-user" id="set-email" placeholder="Email anda">
        <button class="btn-save-setting" id="save-button" style="display: none;">Simpan perubahan</button>
        <a href="index.html" class="link-logout"
          ><img
            src="img/icon-logout.png"
            alt="Logout Icon"
            class="menu-icon"
          /><span class="menu-text">Logout</span>
        </a>
      </nav>

      <!-- Sidebar -->
      <nav class="side-panel">
        <img
          src="img/logo hitam.png"
          alt="Logo Icon"
          width="150px"
          class="logo-icon"
        />
        <ul class="menu-list">
          <li>
            <a href="#" data-page="beranda" class="active"
              ><img
                src="img/icon-beranda.png"
                alt="Beranda Icon"
                class="menu-icon"
              /><span class="menu-text">Beranda</span></a
            >
          </li>
          <li>
            <a href="#" data-page="mengajar"
              ><img
                src="img/icon-mengajar.png"
                alt="Mengajar Icon"
                class="menu-icon"
              /><span class="menu-text">Mengajar</span></a
            >
          </li>
          <li>
            <a href="#" data-page="terdaftar"
              ><img
                src="img/icon-terdaftar.png"
                alt="Terdaftar Icon"
                class="menu-icon"
              /><span class="menu-text">Terdaftar</span></a
            >
          </li>
          <li>
            <a href="#" data-page="tim"
              ><img
                src="img/icon-tim.png"
                alt="Tim Icon"
                class="menu-icon"
              /><span class="menu-text">Tim</span></a
            >
          </li>
          <li>
            <a href="#" data-page="tugas"
              ><img
                src="img/icon-tugas.png"
                alt="Tugas Icon"
                class="menu-icon"
              /><span class="menu-text">Tugas</span></a
            >
          </li>
          <li>

          </li>
        </ul>
      </nav>

      <div type="module" id="app" class="container">
        <!-- IKI SENG DI REFRESH -->
      </div>
    </div>

    <!-- SCRIPT -->
    <script 
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <script type="module" src="js/router.js"></script>
    <script type="module" src="js/partials/navbar.js"></script>
    <script type="module" src="js/partials/settingUser.js"></script>
    <script type="module" src="js/partials/colorPicker.js"></script>
  </body>
</html>
